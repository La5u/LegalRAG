services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      LEGALRAG_NEO4J_URI: bolt://neo4j:7687
      LEGALRAG_NEO4J_USER: neo4j
      LEGALRAG_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-legalrag-password}
      LEGALRAG_OLLAMA_URL: ${LEGALRAG_OLLAMA_URL:-http://host.docker.internal:11434}
      LEGALRAG_VLLM_URL: ${LEGALRAG_VLLM_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./documents:/app/documents:ro
      - ./.cache/huggingface:/app/.cache/huggingface:ro

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-legalrag-password}
      HEALTHCHECK_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-legalrag-password}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${HEALTHCHECK_NEO4J_PASSWORD}\" 'RETURN 1' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
