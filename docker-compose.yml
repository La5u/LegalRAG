services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-legalrag-password}
      HEALTHCHECK_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-legalrag-password}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${HEALTHCHECK_NEO4J_PASSWORD}\" 'RETURN 1' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
