<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legal RAG</title>
  <style>
    body { max-width: 700px; margin: 40px auto; padding: 0 16px; font: 16px Arial; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; }
    select { padding: 10px; }
    button { padding: 10px 16px; }
    #files-button { margin-top: 12px; padding: 6px 10px; }
    #files-panel { margin-top: 4px; }
    #file-list { margin: 8px 0 0; padding: 0; list-style: none; color: #555; }
    #file-list li { padding: 3px 0; }
    .error { color: #a00 !important; }
    #answer { white-space: pre-wrap; margin: 30px 0; }
    details { border-top: 1px solid #ccc; padding: 12px 0; }
    summary { cursor: pointer; }
    details p { line-height: 1.5; }
    .citation { font-size: 0.75em; vertical-align: super; line-height: 0; }
    .citation a { text-decoration: none; }
    .citation a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Legal RAG</h1>
  <form id="chat">
    <input id="question" placeholder="Ask about your documents" required>
    <select id="strategy" aria-label="Retrieval strategy">
      <option value="hybrid">GraphRAG</option>
      <option value="vector">Vector</option>
    </select>
    <button>Ask</button>
  </form>
  <button id="files-button" type="button" aria-expanded="false">Files</button>
  <div id="files-panel" hidden>
    <ul id="file-list"></ul>
  </div>
  <div id="answer"></div>
  <div id="sources"></div>

  <script>
    const form = document.querySelector("#chat");
    const filesButton = document.querySelector("#files-button");
    const filesPanel = document.querySelector("#files-panel");
    const fileList = document.querySelector("#file-list");
    const question = document.querySelector("#question");
    const strategy = document.querySelector("#strategy");
    const answer = document.querySelector("#answer");
    const sources = document.querySelector("#sources");

    function renderAnswer(answerText) {
      answer.replaceChildren();
      const citationPattern = /\[(\d+)\]/g;
      let previousEnd = 0;

      for (const match of answerText.matchAll(citationPattern)) {
        answer.append(document.createTextNode(answerText.slice(previousEnd, match.index)));

        const citation = document.createElement("sup");
        const link = document.createElement("a");
        const chunkNumber = match[1];
        citation.className = "citation";
        link.href = `#source-${chunkNumber}`;
        link.textContent = `[${chunkNumber}]`;
        link.addEventListener("click", (event) => {
          event.preventDefault();
          document.querySelector(link.hash)?.toggleAttribute("open");
        });
        citation.append(link);
        answer.append(citation);
        previousEnd = match.index + match[0].length;
      }

      answer.append(document.createTextNode(answerText.slice(previousEnd)));
    }

    function renderSources(sourceList) {
      for (const source of sourceList) {
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        const text = document.createElement("p");
        details.id = `source-${source.citation}`;
        const score = source.score === null
          ? "context"
          : source.score.toFixed(3);
        const filename = document.createElement("strong");
        filename.textContent = source.document;
        summary.append(
          `${source.citation}. `,
          filename,
          ` | Chunk ${source.chunk} | Score: ${score}`
        );
        text.textContent = source.text;
        details.append(summary, text);
        sources.append(details);
      }
    }

    async function refreshFiles() {
      fileList.replaceChildren();
      const loadingItem = document.createElement("li");
      loadingItem.textContent = "Loading files...";
      fileList.append(loadingItem);

      try {
        const response = await fetch("/documents");
        if (!response.ok) throw new Error("Request failed");

        const data = await response.json();
        fileList.replaceChildren();
        for (const fileInfo of data.documents) {
          const item = document.createElement("li");
          item.textContent = `${fileInfo.name} - ${fileInfo.chunks} chunks`;
          fileList.append(item);
        }
      } catch {
        loadingItem.textContent = "Could not load files.";
        loadingItem.className = "error";
      }
    }

    filesButton.addEventListener("click", () => {
      const opening = filesPanel.hidden;
      filesPanel.hidden = !opening;
      filesButton.setAttribute("aria-expanded", String(opening));
    });

    refreshFiles();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      let dotCount = 1;
      answer.textContent = "Thinking.";
      const dotAnimation = setInterval(() => {
        dotCount = dotCount === 3 ? 1 : dotCount + 1;
        answer.textContent = `Thinking${".".repeat(dotCount)}`;
      }, 500);
      sources.replaceChildren();

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question: question.value, strategy: strategy.value})
        });
        if (!response.ok) throw new Error("Request failed");

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let answerText = "";

        while (true) {
          const {value, done} = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line) continue;
            let message;
            try {
              message = JSON.parse(line);
            } catch {
              throw new Error("Received malformed response from server");
            }
            if (message.type === "sources") {
              renderSources(message.sources);
            } else if (message.type === "token") {
              clearInterval(dotAnimation);
              answerText += message.text;
              answer.textContent = answerText;
            } else if (message.type === "error") {
              throw new Error("Generation failed");
            }
          }

          if (done) break;
        }

        if (!answerText.trim()) {
          throw new Error("Generation returned no visible answer");
        }
        renderAnswer(answerText);
      } catch {
        answer.textContent = "The request failed. Check Neo4j, Ollama, and the server logs.";
      } finally {
        clearInterval(dotAnimation);
      }
    });
  </script>
</body>
</html>
