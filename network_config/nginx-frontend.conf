# Reverse proxy for the LegalRAG frontend server.
#
# Serves frontend/index.html as a static file and proxies the API
# endpoints to the backend server, so the browser only ever talks to
# ONE origin (this one) and never learns the backend's address.
#
# Install:
#   1. Copy frontend/index.html to /var/www/legalrag/index.html on this server.
#   2. Copy this file to /etc/nginx/sites-available/legalrag.conf
#      and symlink it into /etc/nginx/sites-enabled/.
#   3. Fill in the placeholders below (SERVER_NAME, BACKEND_HOST, PROXY_SECRET).
#   4. Get a TLS cert for SERVER_NAME (e.g. `certbot --nginx`) — do this
#      BEFORE relying on this config in production, browsers will refuse
#      to talk to an RAG demo over plain HTTP on a public domain.
#   5. `nginx -t && systemctl reload nginx`

upstream legalrag_backend {
    # Prefer a private-network / VPC address here so the backend is never
    # reachable from the public internet at all. Falls back to a public
    # IP only if you don't have a private network between the two hosts —
    # in that case the backend-side firewall rule in README.md is what
    # actually enforces "only this server may call it".
    server BACKEND_HOST:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name SERVER_NAME;
    # certbot --nginx will add the TLS server block and the redirect below.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name SERVER_NAME;

    # ssl_certificate / ssl_certificate_key are managed by certbot once
    # you've run `certbot --nginx -d SERVER_NAME`.

    root /var/www/legalrag;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Streamed NDJSON responses (token-by-token). Buffering must stay off
    # or the frontend's live "typing" effect arrives as one blob at the end.
    location /ask {
        proxy_pass http://legalrag_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Proxy-Secret "PROXY_SECRET";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # LLM generations can run long; keep the connection open.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /documents {
        proxy_pass http://legalrag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Proxy-Secret "PROXY_SECRET";
    }
}
